services:

  architecture_db_greenx:
    image: mysql:8.0
    container_name: architecture_db_greenx
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql


  backend:
    build:
      context: ./GreenX_DCS_Assesment_Tool_Backend
      dockerfile: Dockerfile

    container_name: greenx-backend
    restart: unless-stopped

    env_file:
      - ./GreenX_DCS_Assesment_Tool_Backend/.env

    ports:
      - "8000:8000"

    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"


  frontend:
    build:
      context: ./greenX-assessment-tool-frontend
      dockerfile: Dockerfile

    container_name: greenx-frontend
    restart: unless-stopped

    environment:
      HOST: 0.0.0.0

    depends_on:
      - backend

    ports:
      - "3000:3000"


volumes:
  mysql_data:

